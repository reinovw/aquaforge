<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Cancelled — AquaForge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=Space+Mono:wght@700&display=swap');
  :root{--bg:#080C16;--panel:#121B30;--panel-border:#212F4A;--teal:#2BD9CB;--amber:#F2A93B;--text:#F4F6FA;--muted:#90A0BD;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .icon{width:80px;height:80px;border-radius:50%;background:rgba(242,169,59,0.12);border:2px solid var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;}
  .icon svg{width:36px;height:36px;stroke:var(--amber);}
  h1{font-family:'Archivo Black',sans-serif;font-size:clamp(28px,5vw,42px);margin-bottom:14px;}
  p{color:var(--muted);font-size:16px;max-width:440px;line-height:1.6;margin-bottom:10px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:999px;font-weight:700;font-size:15px;border:none;cursor:pointer;text-decoration:none;background:var(--amber);color:#1A1304;transition:background .2s;margin-top:28px;}
  .btn:hover{background:#ffbd55;}
  .logo{font-family:'Archivo Black',sans-serif;font-size:20px;margin-bottom:48px;letter-spacing:1px;}
</style>
</head>
<body>
  <div class="logo">AquaForge</div>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
  <h1>Payment Cancelled</h1>
  <p>No charge was made. Your cart is still waiting — head back and try again whenever you're ready.</p>
  <a class="btn" href="https://www.aquaforge3d.co.za">Back to shop</a>
</body>
</html>
